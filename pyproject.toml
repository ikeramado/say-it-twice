[project]
name = "say-it-twice"
version = "0.1.0"
description = "say-it-twice"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "openai>=3.55.1",
    "pillow>=11.0.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pytest",
    "ruff",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-W error::DeprecationWarning"
testpaths = ["tests"]
