# Entitlements a correct explanation may state, per rule version and per policy version.
# An explanation that states a phrase of `vocabulary` not listed for its case's rule version or
# policy version is an invented entitlement (case-insensitive phrase match; docs/modules/prereg.md section 5).
vocabulary:
- ticket refund
- full refund
- refund of taxes and fees
- refund within 7 business days
- refund within 20 days
- automatic refund
- refund of ancillary fees
- refund of the unused portion
- refund to the original form of payment
- travel credit
- voucher
- compensation
- rebooking
