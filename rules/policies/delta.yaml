carrier: DL
name: Delta Air Lines
versions:
- id: DL-2023-06-22
  carrier_date: '2023-06-22'
  coverage:
  - first: '2024-01-01'
    last: '2024-02-29'
  source_file: rules/sources/delta-contract-2023-06-22.html
  clauses:
  - id: DL-2023-06-22-1B-governing-rules
    section: 1B
    topic: governing-rules
    text: Your travel is governed by the rules that were in effect on the date you purchased your ticket; provided, however, that Delta reserves the right to apply rules currently in effect on the date of your travel where reasonably necessary for operational reasons and where the change in rule does not have a material negative impact upon you.
    source_file: rules/sources/delta-contract-2023-06-22.html
  - id: DL-2023-06-22-19A-schedule-change
    section: 19A
    topic: schedule-change
    text: If there is a flight cancellation, diversion, delay of greater than 120 minutes, or that will cause a passenger to miss connections, Delta will (at passenger’s request) cancel the remaining ticket and refund the unused portion of the ticket and unused ancillary fees in the original form of payment in accordance with Rule 22
    source_file: rules/sources/delta-contract-2023-06-22.html
  - id: DL-2023-06-22-22-refund-trigger
    section: '22'
    topic: refund-trigger
    text: 'If a refund is required because of Delta''s failure to operate on schedule or refusal to transport (except as a result of passenger’s failure to comply with the contract of carriage), the following refund will be made directly to you:'
    source_file: rules/sources/delta-contract-2023-06-22.html
  - id: DL-2023-06-22-22C-time-limit
    section: 22C
    topic: time-limit
    text: No refund will be issued on any ticket unless Delta receives a request for the refund and any unused coupons are surrendered to Delta within one year of the original issue date of the ticket.
    source_file: rules/sources/delta-contract-2023-06-22.html
