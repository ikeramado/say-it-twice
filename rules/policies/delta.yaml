- id: DL-2024-10-28
  carrier_date: '2024-10-28'
  coverage:
  - first: '2024-11-12'
    last: '2024-11-30'
  - first: '2025-01-01'
    last: '2025-01-31'
  source_file: rules/sources/delta-contract-2024-10-28.html
  clauses:
  - id: DL-2024-10-28-1B-governing-rules
    section: 1B
    topic: governing-rules
    text: Your travel is governed by the rules that were in effect on the date you purchased your ticket; provided, however, that Delta reserves the right to apply rules currently in effect on the date of your travel where reasonably necessary for operational reasons and where the change in rule does not have a material negative impact upon you.
    source_file: rules/sources/delta-contract-2024-10-28.html
  - id: DL-2024-10-28-19A-schedule-change
    section: 19A
    topic: schedule-change
    text: 'If there is a flight cancellation, change in departure time to depart 180 minutes or more before the original scheduled departure time, change in arrival time to arrive 180 minutes or more after the original scheduled arrival time, change that will cause a passenger to miss connections, or in the event of a significantly delayed or changed flight pursuant to applicable law, Delta will, (i) at passenger’s request, (ii) if Delta does not offer an alternative flight or voucher option, or (iii) if the passenger does not respond to the offer on an alternative flight or voucher option prior to the originally scheduled departure time: cancel the remaining ticket and refund the unused portion of the ticket and unused ancillary fees (and including any paid checked bag fees) in the original form of payment in accordance with Rule 22'
    source_file: rules/sources/delta-contract-2024-10-28.html
  - id: DL-2024-10-28-22-refund-trigger
    section: '22'
    topic: refund-trigger
    text: 'If a refund is required due to a flight cancellation or significantly delayed or changed flight pursuant to Rule 19(A) or refusal to transport pursuant to Rule 7 (except as a result of passenger’s failure to comply with the Contract of Carriage), the following refund will be made directly to you:'
    source_file: rules/sources/delta-contract-2024-10-28.html
  - id: DL-2024-10-28-22C-time-limit
    section: 22C
    topic: time-limit
    text: No refund will be issued on any ticket unless Delta receives a request for the refund and any unused coupons are surrendered to Delta within one year of the original issue date of the ticket.
    source_file: rules/sources/delta-contract-2024-10-28.html
