carrier: AA
name: American Airlines
versions:
- id: AA-2023-10-10
  carrier_date: '2023-10-10'
  coverage:
  - first: '2024-01-01'
    last: '2024-01-31'
  source_file: rules/sources/american-contract-2023-10-10.html
  clauses:
  - id: AA-2023-10-10-delay-refund
    section: delay
    topic: refund
    text: If we or our airline partner fails to operate or delays your arrival more than 4 hours, our sole obligation is to refund the remaining ticket value and any optional fees according to our involuntary refunds policy, subject to our policy for rebooking your delayed / canceled flight.
    source_file: rules/sources/american-contract-2023-10-10.html
  - id: AA-2023-10-10-involuntary-refund
    section: involuntary
    topic: refund
    text: 'If you are due a refund because we failed to operate on schedule (a delay to your departure time of over 4 hours) or we refused to let you fly for reasons other than your violation of this contract, we will refund you: The full amount of the ticket and any extras if travel hasn''t started The value of the unused travel if the ticket is partially used If you were involuntarily denied boarding, we will not charge any refund fees'
    source_file: rules/sources/american-contract-2023-10-10.html
  - id: AA-2023-10-10-non-refundable-refund
    section: non-refundable
    topic: refund
    text: 'We will refund a non-refundable ticket (or the value of the unused segment of your trip) to the original form of payment if: You cancel within 24 hours of booking (and booked at least 2 days before departure). We cancel your flight We make a schedule change that results in a change of more than 4 hours to your departure time'
    source_file: rules/sources/american-contract-2023-10-10.html
