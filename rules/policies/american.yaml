- id: AA-2024-10-28
  carrier_date: '2024-10-28'
  coverage:
  - first: '2024-11-13'
    last: '2025-01-31'
  source_file: rules/sources/american-contract-2024-10-28.html
  clauses:
  - id: AA-2024-10-28-delay-refund
    section: delay
    topic: refund
    text: If we or our airline partner cancels your flight or your departure or arrival is delayed for 3 or more hours (domestic) / 4 or more hours (international), our sole obligation is to refund the unused ticket value and any optional fees according to our involuntary refunds policy, subject to our policy for rebooking your delayed / canceled flight.
    source_file: rules/sources/american-contract-2024-10-28.html
  - id: AA-2024-10-28-involuntary-refund
    section: involuntary
    topic: refund
    text: 'If you are due a refund because we refused to let you fly for reasons other than your violation of this contract, we will refund you: The full amount of the ticket and any extras if travel hasn''t started The value of the unused travel if the ticket is partially used If you were involuntarily denied boarding, we will not charge any refund fees'
    source_file: rules/sources/american-contract-2024-10-28.html
  - id: AA-2024-10-28-non-refundable-refund
    section: non-refundable
    topic: refund
    text: 'We will refund a non-refundable ticket (or the value of the unused segment of your trip) to the original form of payment if: You cancel within 24 hours of booking (and booked at least 2 days before departure). We cancel your flight We make a schedule change that results in a change of more than 4 hours to your departure time'
    source_file: rules/sources/american-contract-2024-10-28.html
  - id: AA-2024-10-28-automatic-refund
    section: automatic
    topic: refund
    text: 'We promptly and automatically refund customers for: The ticketed fare, including taxes and fees, if there is a cancellation or significant flight itinerary change, when the customer chooses either not to fly on the changed flight, accept rebooking on an alternative flight, or accept other compensation. A flight number change is considered a cancellation. Eligible flight itinerary changes include: Changes to itineraries for 3 or more hours (domestic) / 4 or more hours (international) Changes in origination / destination airports Downgrades to a lower cabin Increased number of connections'
    source_file: rules/sources/american-contract-2024-10-28.html
